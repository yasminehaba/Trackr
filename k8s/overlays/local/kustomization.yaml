# ─────────────────────────────────────────────────────────────────────────────
# Overlay « local » : Trackr sur Minikube.
#   Prévisualiser : kubectl kustomize k8s/overlays/local
#   Appliquer     : kubectl apply -k k8s/overlays/local
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trackr

resources:
  - ../../base

# Versions déployées : tags immuables publiés par le workflow Publish.
images:
  - name: trackr-backend
    newName: ghcr.io/yasminehaba/trackr-backend
    newTag: sha-8261cd4
  - name: trackr-frontend
    newName: ghcr.io/yasminehaba/trackr-frontend
    newTag: sha-8261cd4

# Secrets générés à partir de fichiers locaux ignorés par Git (*.env).
# Kustomize ajoute un suffixe (hash du contenu) au nom : modifier un secret
# provoque automatiquement le redémarrage des pods qui l'utilisent.
generatorOptions:
  labels:
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: trackr

secretGenerator:
  - name: trackr-db-credentials
    envs: [db.env]
  - name: trackr-backend-secrets
    envs: [backend.env]

patches:
  # URL publique de l'application sur Minikube.
  - target:
      kind: Ingress
      name: trackr
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: trackr.local
  - target:
      kind: ConfigMap
      name: trackr-config
    patch: |-
      - op: replace
        path: /data/CORS_ALLOWED_ORIGINS
        value: http://trackr.local