# ─────────────────────────────────────────────────────────────────────────────
# Backend Spring Boot — ServiceAccount + Deployment + Service.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trackr-backend
  labels:
    app.kubernetes.io/name: trackr-backend
    app.kubernetes.io/part-of: trackr
# L'application n'appelle pas l'API Kubernetes : pas de jeton monté (moindre privilège).
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackr-backend
  labels:
    app.kubernetes.io/name: trackr-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: trackr
spec:
  # 1 réplique tant que le schéma est créé par Hibernate (ddl-auto) :
  # deux pods qui démarrent ensemble sur une base vide se gêneraient.
  # Passage à 2+ répliques après l'introduction de Flyway (phase K).
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # crée le nouveau pod avant d'arrêter l'ancien
      maxUnavailable: 0    # jamais moins de pods prêts que demandé : pas de coupure
  selector:
    matchLabels:
      app.kubernetes.io/name: trackr-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trackr-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: trackr
    spec:
      serviceAccountName: trackr-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: trackr-backend          # remplacée par l'overlay (ghcr.io/...:sha-xxxxxxx)
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom: { configMapKeyRef: { name: trackr-config, key: SPRING_PROFILES_ACTIVE } }
            - name: SPRING_DATASOURCE_URL
              valueFrom: { configMapKeyRef: { name: trackr-config, key: SPRING_DATASOURCE_URL } }
            - name: CORS_ALLOWED_ORIGINS
              valueFrom: { configMapKeyRef: { name: trackr-config, key: CORS_ALLOWED_ORIGINS } }
            - name: JWT_ACCESS_EXPIRATION
              valueFrom: { configMapKeyRef: { name: trackr-config, key: JWT_ACCESS_EXPIRATION } }
            - name: JWT_REFRESH_EXPIRATION
              valueFrom: { configMapKeyRef: { name: trackr-config, key: JWT_REFRESH_EXPIRATION } }
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: trackr-db-credentials, key: POSTGRES_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: trackr-db-credentials, key: POSTGRES_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: trackr-backend-secrets, key: JWT_SECRET } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Démarrage lent de la JVM : la sonde de démarrage laisse jusqu'à 150 s
          # avant que les sondes liveness/readiness prennent le relais.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          # Liveness : le processus est-il bloqué ? Si oui, Kubernetes redémarre le conteneur.
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness : peut-il recevoir du trafic (base joignable) ? Sinon, retiré du Service.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: tmp          # Tomcat écrit dans /tmp : le reste du système de fichiers est en lecture seule
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: trackr-backend
  labels:
    app.kubernetes.io/name: trackr-backend
    app.kubernetes.io/part-of: trackr
spec:
  type: ClusterIP            # joignable uniquement depuis le cluster
  selector:
    app.kubernetes.io/name: trackr-backend
  ports:
    - name: http
      port: 8080
      targetPort: http