spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      # Hibernate VÉRIFIE le schéma au démarrage, il ne le modifie plus jamais.
      # Le schéma est géré uniquement par Flyway (db/migration).
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # Base existante sans historique Flyway (créée par Hibernate) :
    # Flyway la marque comme étant déjà en V1 au lieu d'exécuter V1.
    # Base vide : V1 est exécutée normalement.
    baseline-on-migrate: true
    baseline-version: 1
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
    endpoint:
    health:
      show-details: never
      # /actuator/health/liveness et /actuator/health/readiness (sondes Kubernetes)
      probes:
        enabled: true
      group:
        # Le pod ne reçoit du trafic que si la base de données répond.
        readiness:
          include: readinessState,db

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
